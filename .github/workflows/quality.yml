name: Quality baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Normalize comparison base
        run: |
          if [ -z "$QUALITY_BASE" ] || ! git cat-file -e "$QUALITY_BASE^{commit}" 2>/dev/null; then
            echo "QUALITY_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install analysis tools
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/ci/requirements.txt
      - name: Python syntax
        run: python -m compileall -q custom_components
      - name: Block new Python defects
        run: python .github/ci/lint_baseline.py ruff ruff check --isolated --no-respect-gitignore --select E9,F63,F7,F82 --output-format json custom_components
      - name: Python type diagnostics (initial baseline report)
        continue-on-error: true
        run: mypy --ignore-missing-imports --follow-imports skip custom_components
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install frontend lint tools
        run: npm ci --prefix .github/ci/node-tools --ignore-scripts --no-audit --no-fund
      - name: Block new frontend lint defects
        run: python .github/ci/lint_baseline.py eslint "$PWD/.github/ci/node-tools/node_modules/.bin/eslint" --config "$PWD/.github/ci/frontend-eslint.config.mjs" --format json custom_components/simple_irrigation/frontend/src
      - name: Frontend typecheck (initial baseline report)
        continue-on-error: true
        working-directory: custom_components/simple_irrigation/frontend
        run: |
          npm ci --ignore-scripts
          npx --no-install tsc --noEmit
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/hassfest.sh
